## 1. RESUMEN EJECUTIVO Y PROPÓSITO DEL DICTAMEN

El presente diagnóstico evalúa de manera técnica, rigurosa e independiente la **segunda versión remitida del documento técnico (43 páginas)**, contentivo de la propuesta de transición del modelo de matrícula de posgrados de la UPTC hacia un esquema de cobro basado en créditos académicos y actualizado mediante el Índice de Ajuste Económico de Posgrados (IAEP).

Esta versión incorpora ajustes pertinentes derivados de las mesas de trabajo institucional, tales como la actualización del equipo directivo para el segundo semestre de 2026 (con la Dra. Patricia Carolina Barreto en la Vicerrectoría Administrativa y Financiera y el Dr. Jorge Enrique Romero en la Dirección de Planeación), la corrección de la fórmula notacional del IAEP (`w_ICES × ICES`), la justificación metodológica del límite de 15 créditos para efectos de simulación y la profundización del análisis de riesgo probabilístico mediante **20.000 iteraciones de Monte Carlo** con aperturas semestrales para 2027-1 y 2027-2.

No obstante, la auditoría integral confirma que **la nueva versión conserva problemas metodológicos y matemáticos de fondo**, e introduce nuevos errores de maquetación editorial que deben ser subsanados antes de su radicación ante los cuerpos colegiados de gobierno.

## 3. PRINCIPALES ALERTAS TÉCNICAS Y RECOMENDACIONES DE LA OFICINA

### 3.1. Re-estimación del Escenario Pesimista bajo Costeo ABC
En la página 34, la Tabla 1 mantiene la hipótesis de que ante una caída del 15% en los ingresos, los egresos aumentan en un 10% en bloque, proyectando un flujo neto negativo de -$6.397 millones y un VAN de -$5.283 millones. Esta estimación desvirtúa la estructura de costos institucionales, pues el 45,5% de los egresos corresponde a la deducción central que disminuye automáticamente con el recaudo, y el 40% de los costos directos son variables (horas cátedra). Al corregir la modelación con costeo ABC estricto, **el escenario pesimista arroja un flujo neto positivo de +$18.262 millones**, demostrando que el modelo es altamente sostenible.

### 3.2. Conciliación Definitiva de la Tabla 2 (Flujos Descontados)
Los autores realizaron un ajuste parcial en los valores descontados de la Tabla 2 (pág. 35), alcanzando un total aproximado de $29.019.531.303, pero subsiste una diferencia de $52.279 frente al VAN del texto ($29.019.583.582). En el documento reconstruido se aplican los flujos continuos exactos al peso para garantizar coherencia contable absoluta.

### 3.3. Integración de la Nueva Evidencia Monte Carlo (20.000 iteraciones)
La incorporación de la simulación de 20.000 ciclos en las páginas 30 y 31 aporta un valioso soporte empírico: demuestra que la mediana de recaudo para 2027 ($42.644 millones) supera en $1.644 millones la meta institucional ($41.000 millones), y que la probabilidad de no alcanzar la meta disminuye del 46,4% en 2027-1 al 19,0% en 2027-2 tras la actualización del crédito.
