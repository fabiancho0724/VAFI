# PRODUCTO 6: MATRIZ DE TRAZABILIDAD DOCUMENTAL INTEGRAL
## SISTEMA MULTIAGENTE DE INTELIGENCIA TÉCNICA Y FINANCIERA (VAFI - UPTC)
### EVOLUCIÓN COMPARATIVA: DOCUMENTO V1 (42 PÁG.) vs. DOCUMENTO V2 (43 PÁG.) vs. DOCUMENTO RECONSTRUIDO DEFINITIVO

---

## 1. RESUMEN DE TRAZABILIDAD Y EVOLUCIÓN DOCUMENTAL

Esta matriz certifica el origen, evolución y destino de cada componente conceptual, normativo, cuantitativo y metodológico analizado a lo largo del proceso de auditoría y fortalecimiento técnico del Documento Técnico de Posgrados de la UPTC.

```
+-----------------------------------------------------------------------------------------+
| ESTADO DE LOS COMPONENTES TÉCNICOS EN EL EXPEDIENTE RECONSTRUIDO                        |
|                                                                                         |
| [ORIGINAL CONSERVADO DE V1/V2]  : 40% (Estructura base, diagnóstico empírico, VBCI)     |
| [AJUSTES DE AUTORES EN V2]      : 20% (Autoridades, Monte Carlo 20k, pasantías)         |
| [CORRECCIONES TÉCNICAS MULTIAG.]: 25% (Aritmética VAN, costeo ABC estrés, RCCO, índice)|
| [NUEVAS SALVAGUARDAS Y BAREMOS] : 15% (Baremo VCAP 1-5, gradualidad, fondo colchón)    |
+-----------------------------------------------------------------------------------------+
```

---

## 2. MATRIZ DETALLADA DE TRAZABILIDAD TRIPARTITA (V1 vs. V2 vs. RECONSTRUIDO)

| Sección / Componente | Versión Original v1 (42 pág.) | Versión Modificada Autores v2 (43 pág.) | Versión Reconstruida Definitiva (Multiagente) | Justificación Técnica de la Intervención |
|---|---|---|---|---|
| **Portada y Equipo Formulador** | Equipo sin diferenciación de vigencias en direcciones; Patricia Barreto en Planeación y Luis Ángel Lara en VAFI. | **Actualizado por autores:** Incorpora a Jorge Romero en Planeación (2026-2), Patricia Barreto en VAFI (2026-2) y Fabian Cely. | **Validado y Estandarizado:** Se mantiene la nómina completa y oficializada de autoridades y profesionales técnicos. | Rigor institucional y reconocimiento formal de las directivas universitarias responsables del proyecto ante el CSU. |
| **Tabla de Contenido / Índice** | Índice estándar generado en Word. | **Deteriorado en v2:** Aparecen tres mensajes de error: `¡Error! Marcador no definido` en títulos del índice. | **Depurado al 100%:** Reconstrucción total de la tabla de contenido sin hipervínculos rotos ni errores de Word. | Calidad editorial indispensable para un documento rector presentado ante el máximo órgano de gobierno universitario. |
| **Diagnóstico: Series de Matrícula** | Contradicción entre registros: 6.897 est. (2025), 6.945 en simulación y 5.170 en corte 2026. | Mantiene los datos históricos e introduce la población modelada de 7.143 estudiantes para el nuevo Monte Carlo. | **Armonizado:** Se aclara la distinción entre matrícula semestral (5.170), histórico anual (6.897) y modelada 2027 (7.143). | Coherencia estadística y blindaje ante observaciones de órganos de control fiscal o del Consejo Superior. |
| **Cap. 2 (Pie de página 7 - Figura 4)** | Gráfica y pie de figura en formato horizontal normal. | **Defecto en v2:** Salto de sección anómalo que genera texto vertical roto e ilegible: `F-i-g-u-r-a 4 . M-a`. | **Corregido:** Eliminación del salto de sección defectuoso y restitución horizontal de la rotulación de la Figura 4. | Presentación visual limpia y profesional en todas las versiones exportadas (Word, PDF, HTML). |
| **Análisis de Competitividad (Boyacá y Virtual)** | Tablas comparativas de precios por crédito de universidades competidoras (Boyacá y virtual). | Conservado sin alteraciones. | **Conservado y Diagramado:** Se mantienen íntegros los datos oficiales de mercado elaborados por Planeación. | Los datos empíricos son sólidos y demuestran la pérdida de competitividad de la UPTC por indexación a SMLMV. |
| **VBCI Institucional y Factores de Modalidad** | VBCI 2026 ($900k, $630k, $450k). Factores de modalidad solo sugeridos en Fig. 10. | Mantiene los valores de VBCI y la ilustración de factores (1,0; 0,85; 0,70). | **Formalizado:** Se consagran como parámetros formales en la Ecuación 2 del documento técnico. | Certeza jurídica para la formulación y apertura de futuros programas híbridos y virtuales. |
| **Baremo Paramétrico VCAP (CP, C, E, P)** | Criterios cualitativos vagos sin baremo, propiciando discrecionalidad administrativa. | Mantiene la descripción cualitativa sin baremo numérico estandarizado. | **Nuevo Incorporado:** Se adopta la **Matriz Paramétrica de 1 a 5** con función matemática lineal de transformación a [0,8 ; 2,5]. | Erradicar la discrecionalidad y evitar reclamaciones o conflictos entre facultades y el Comité de Posgrados. |
| **Mecanismo de Actualización (IAEP)** | Notación ambigua ($w_{EDU} × EDU$). Delegación directa a Planeación/VAFI. | **Mejorado en v2:** Corrige la notación a $w_{ICES} × ICES$. | **Blindado Jurídicamente:** Unifica la notación, ratifica piso en IPC y reserva la competencia al CSU (Ley 30/1992). | Prevenir demandas de nulidad por violación del artículo 65 de la Ley 30 de 1992 en fijación de derechos pecuniarios. |
| **Régimen de Pasantías y Estancias Doctorales** | Solo se contemplaba reducción del 50% para tesis doctoral tradicional. | **Incorporado en v2:** Añade las pasantías doctorales y estancias de investigación al beneficio del 50% del VCAP. | **Reglamentado:** Se ratifica el 50% de VCAP y se precisan los requisitos operativos (plan aprobado y tutor externo). | Fomentar la internacionalización y movilidad doctoral sin generar desfinanciamiento operativo. |
| **Tope de Liquidación de 15 Créditos** | Presentado ambiguamente como límite de créditos del estudiante. | **Aclarado en v2:** Especifica en el texto que es un tope de simulación y no una barrera académica restrictiva. | **Consolidado:** Se ratifica que es un parámetro de modelación conservadora y se fija el cobro de créditos adicionales. | Respetar la libertad académica del estudiante y garantizar cobro justo por créditos adicionales cursados. |
| **Simulación Estática por Niveles** | Caída en Especializaciones (-20,46%) y alzas en Maestrías (+21%) y Doctorados (+23%). | Conserva las mismas cifras de recaudo estático ($37.276M vs $40.015M actual). | **Conservado con Alerta de Riesgo:** Se mantienen las cifras oficiales y se transparenta el riesgo de subsidio cruzado. | Rigor analítico: no maquillar el impacto de la reducción en especializaciones, que aportan el 62,4% del fondo. |
| **Estrategia de Gradualidad para Especializaciones** | Inexistente (se asumía la caída de $5.109M en bloque en el año 1). | Inexistente en v2 (se mantuvo la misma formulación de v1). | **Nuevo Incorporado:** Esquema de **Convergencia Bienal** (factor suavizador 1,12 en 2027 y 1,06 en 2028). | Prevenir choques traumáticos de liquidez en las facultades durante los dos primeros años de vigencia. |
| **Simulación Monte Carlo de Riesgo** | Modelo con 10.000 iteraciones (mediana $38.373M, 14,99% riesgo de fallo sobre meta menor). | **Actualizado por autores en v2:** 20.000 iteraciones sobre meta de $41.000M (mediana $42.644M, 30,8% riesgo). | **Auditado e Interpretado:** Se auditan las 20.000 corridas y se descubre la asimetría estacional (46,4% riesgo en 2027-1). | Detectar la vulnerabilidad de caja en el primer semestre de 2027 y proponer el fondo de colchón de liquidez. |
| **Costeo ABC en Escenario Pesimista** | Egresos aumentados en bloque en +10% arrojando déficit ficticio de -$6.397M (VAN -$5.283M). | **Persiste el defecto en v2:** Se mantiene idéntica la Tabla 1 con el déficit ficticio en la pág. 34. | **Corregido Científicamente:** Aplicación estricta de costeo ABC: resulta superávit de **+$18.262M** y VAN **+$15.080M**. | Demostrar ante el CSU que el modelo es altamente superavitario y resiliente incluso bajo estrés de demanda. |
| **Cuadre Aritmético del VAN (Tablas 1 y 2)** | Descuadre de $1.465.050 entre Tabla 1 ($29.019.583.582) y Tabla 2 ($29.021.048.632). | **Ajustado en v2:** Los autores cambian Tabla 2 a $29.019.531.303, persistiendo un desfase de **$52.279**. | **Reconciliado Continuo al Peso:** Se presenta la tabla de cálculo continuo exacto ($29.019.583.582) con nota técnica. | Precisión matemática absoluta y blindaje contra hallazgos en auditorías de control fiscal. |
| **Terminología Financiera: Ratio DSCR** | Uso de la sigla "Ratio DSCR: 1,43x" en la Figura 22. | Persiste el rótulo "Ratio DSCR: 1,43x" en la Figura 22 de la pág. 36. | **Corregido:** Sustituido por **Razón de Cobertura de Costos Operacionales y Deducciones Centrales (RCCO)**. | Corrección conceptual: el Fondo R31 de la UPTC es un fondo especial presupuestal sin endeudamiento bancario. |
| **Fundamentación Tasa Descuento (8%)** | Tasa adoptada sin explicación económica en el texto. | Mantiene el 8,0% E.A. sin desarrollo teórico. | **Fundamentado:** Descomposición analítica de Fisher (inflación 3% + prima real y liquidez 5%). | Cumplimiento del estándar metodológico del DNP y Contraloría para proyectos de inversión pública. |
| **Calidad Tipográfica y Redacción** | Redacción formal pero con algunas expresiones retóricas. | **Erratas en v2:** "situaciones académicas especias" (pág. 20) y grafía "Uptc" en minúscula. | **Corregido:** Corrección de erratas ("especiales") y estandarización rigurosa de la sigla oficial "UPTC". | Excelencia ortotipográfica y dignidad de estilo para presentación institucional de alto nivel. |

## 3. CERTIFICACIÓN DE TRAZABILIDAD Y COHERENCIA COLEGIADA

La Oficina de Inteligencia Técnica, Financiera y Normativa certifica que el **Documento Técnico Reconstruido Integralmente** conserva fielmente todas las mejoras sustantivas aportadas por los autores en el Documento v2 (ampliación de Monte Carlo a 20.000 iteraciones, inclusión de pasantías doctorales y actualización de directivas), subsanando de manera definitiva los errores residuales de cálculo, edición, diagramación y costeo ABC.
