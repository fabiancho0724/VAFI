# WALKTHROUGH: AUDITORÍA Y FORTALECIMIENTO INTEGRAL DEL DOCUMENTO TÉCNICO V2 (43 PÁGINAS)
## SISTEMA MULTIAGENTE DE INTELIGENCIA TÉCNICA, FINANCIERA, ECONÓMICA, PRESUPUESTAL Y NORMATIVA
### VICERRECTORÍA ADMINISTRATIVA Y FINANCIERA (VAFI) - UPTC | NOVIEMBRE 2026

---

## 1. RESUMEN EJECUTIVO DE LA INTERVENCIÓN

La Oficina de Inteligencia Técnica, Financiera y Normativa ejecutó la auditoría integral y fortalecimiento del nuevo **Documento Técnico v2 (43 páginas)** remitido para trámite ante el Consejo Superior Universitario (CSU).

El Documento v2 incorporó mejoras importantes preparadas por el equipo formulador (ampliación de Monte Carlo a 20.000 iteraciones, clarificación del carácter no restrictivo de los 15 créditos, inclusión de pasantías doctorales al 50% VCAP y actualización de directivas). Sin embargo, presentaba aún tres inconsistencias financieras y metodológicas de fondo, así como tres errores críticos de diagramación y edición en Microsoft Word.

A través del panel colegiado de 10 agentes especializados, se sanearon, recalcularon y fortalecieron todos los componentes, entregando la suite oficial de **7 Productos Oficiales** en tres formatos de alta calidad: **Markdown (.md)**, **Web Interactivo / PDF (.html)** y **Microsoft Word (.docx)** con tipografía institucional, cajas de llamado para fórmulas y **cero errores de símbolos o LaTeX**.

## 3. PRINCIPALES MEJORAS Y CORRECCIONES INCORPORADAS

### 3.1. Reconciliación Aritmética Absoluta del VAN y Resolución de las 6 Inconsistencias
- **Cuadre Intertablas ($0 diff):** Se unificó el ingreso cuatrienal base en **$180.213.498.258 COP** y egresos en **$145.073.425.375 COP** en la Tabla 1 y Tabla 2, eliminando el desfase histórico de $8.000.908 COP.
- **Resta de 2030 ($0 diff):** Se subsanó la errata tipográfica en la vigencia 2030, corrigiendo el Flujo Neto Operacional a **$9.194.927.086 COP** (resolviendo el desfase de $800 COP).
- **Cuadre Vertical del VAN ($0 diff):** Se cuadró la sumatoria vertical de los cuatro flujos descontados anuales para coincidir exactamente con el VAN consolidado de **$29.019.584.258 COP**, eliminando la discrepancia de $313 COP.
- **Sincronización Narrativa:** Se eliminaron las contradicciones entre tablas y texto (descartando definitivamente las cifras preliminares de -$6.397M, -$5.283M y $63.322M).
- **Mecánica de Costeo ABC:** Se explicitó por qué los egresos totales varían en ±7,0% frente al escenario base (la deducción central al 45,5% absorbe el 56,5% del egreso y se contrae o expande según el recaudo).

### 3.4. Subsanación Editorial y Visual en Word
- Se reconstruyó la tabla de contenido eliminando los tres errores de `¡Error! Marcador no definido`.
- Se corrigió el pie de página 7 eliminando el salto de sección que causaba texto vertical roto `F-i-g-u-r-a 4 . M-a`.
- Se corrigieron las erratas tipográficas de la página 20 ("especias" por "especiales") y se capitalizó uniformemente la sigla "UPTC".
